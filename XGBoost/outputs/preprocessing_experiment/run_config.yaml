paths:
  data: kcb_202306_202405_undersampled_1to4.csv
  feature_types: preprocess/feature_types.csv
  output_dir: XGBoost/outputs/preprocessing_experiment
seed: 42
device: cuda
cpu_jobs: 8
missing_cutoff: 0.5
methods:
- raw_minimal
- current
- drop_missing
- one_hot
- drop_missing_keep_flags
- drop_categorical
- numeric_categories
folds:
- name: F7
  train_end: '202311'
  valid_month: '202312'
- name: F8
  train_end: '202312'
  valid_month: '202401'
- name: F9
  train_end: '202401'
  valid_month: '202402'
test:
  train_end: '202402'
  weights:
    '202403': 0.1
    '202404': 0.3
    '202405': 0.6
model:
  max_rounds: 800
  early_stopping: 50
  max_bin: 256
  baseline:
    learning_rate: 0.05
    max_depth: 6
    min_child_weight: 1.0
    subsample: 0.8
    colsample_bytree: 0.8
    gamma: 0.0
    reg_alpha: 0.0
    reg_lambda: 1.0
    scale_pos_weight: 1.0
    max_cat_to_onehot: 4
    max_cat_threshold: 32
tuning:
  finalists: 2
  trials: 12
  startup_trials: 4
  search:
    learning_rate:
      low: 0.03
      high: 0.1
      log: true
    max_depth:
      low: 3
      high: 8
    min_child_weight:
      low: 1.0
      high: 20.0
      log: true
    subsample:
      low: 0.7
      high: 1.0
    colsample_bytree:
      low: 0.7
      high: 1.0
