paths:
  data: kcb_202306_202405_undersampled_1to4.csv
  feature_types: preprocess/feature_types.csv
  output_dir: XGBoost/outputs

seed: 42
cpu:
  jobs: 8  # 0 uses every detected logical CPU core for each XGBoost fit.
variants: [no_month, month_index]

tuning:
  trials: 250  # Total completed trials per variant, including the baseline.
  startup_trials: 40
  folds: 4
  rounds: 4000
  early_stopping: 100
  search:
    learning_rate: {low: 0.01, high: 0.2, log: true}
    max_depth: {low: 3, high: 10}
    min_child_weight: {low: 0.1, high: 50.0, log: true}
    subsample: {low: 0.6, high: 1.0}
    colsample_bytree: {low: 0.5, high: 1.0}
    gamma: {low: 0.0, high: 10.0}
    reg_alpha: {low: 0.00000001, high: 10.0, log: true}
    reg_lambda: {low: 0.001, high: 100.0, log: true}
    scale_pos_weight: {low: 1.0, high: 4.0}
    max_cat_to_onehot: {choices: [4, 8, 16]}
    max_cat_threshold: {choices: [16, 32, 64]}
  baseline:
    learning_rate: 0.05
    max_depth: 6
    min_child_weight: 1.0
    subsample: 0.8
    colsample_bytree: 0.8
    gamma: 0.0
    reg_alpha: 0.00000001
    reg_lambda: 1.0
    scale_pos_weight: 1.0
    max_cat_to_onehot: 4
    max_cat_threshold: 32

hydra:
  run:
    dir: ${paths.output_dir}/hydra/train/${now:%Y%m%d_%H%M%S}
  job:
    chdir: false
